# Add dsh-parallel to a DSH profile.
# 1. Install the package into the profile (or symlink it into node_modules).
# 2. Append this row to <profile>/cordis.patch.yml.
# 3. Reload the profile; refresh the page to load the browser half.
- insert:
    - id: dsh-parallel
      name: dsh-parallel
      config:
        # Optional. Empty means each session uses its own cwd/repo board.
        root: ''
        # Global recent-project index; no claims are merged across repos.
        registryDir: ~/.dsh/parallel
        heartbeatMs: 15000
        ttlMs: 60000
        # auto (default): write/edit auto-claim and deny live conflicts.
        claimPolicy: auto
        autoClaimTtlMs: 600000
        releaseAutoOnIdle: true
        prompt: true
